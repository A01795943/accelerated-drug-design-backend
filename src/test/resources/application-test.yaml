# Perfil test: H2 in-memory + Flyway (MySQL compatibility mode).
spring:
  flyway:
    enabled: true
    baseline-on-migrate: true
    baseline-version: 1
    locations: classpath:db/migration
    placeholders:
      coreBaseUrl: ${app.core.base-url}
  datasource:
    url: jdbc:h2:mem:drug_accelerator_test;MODE=MySQL;DATABASE_TO_LOWER=TRUE;DB_CLOSE_DELAY=-1;NON_KEYWORDS=USER
    username: sa
    password:
    driver-class-name: org.h2.Driver
  jpa:
    hibernate:
      ddl-auto: validate
    properties:
      hibernate:
        dialect: org.hibernate.dialect.H2Dialect
        type:
          preferred_boolean_jdbc_type: TINYINT

app:
  jwt:
    secret: dGVzdC1qd3Qtc2VjcmV0LWtleS1mb3ItdW5pdC10ZXN0cy1vbmx5LW5vdC1mb3ItcHJvZHVjdGlvbi11c2U=
  core:
    base-url: http://localhost:8000
    stale-claim-minutes: 240
    dispatch-max-attempts: 3
    dispatch-backoff-ms: 30000
    health-interval-ms: 3600000
    metrics:
      poll-interval-ms: 3600000
      retention-days: 7
      max-failures: 3
  generation:
    minibatch-size: 100
    dispatch-interval-ms: 3600000
    max-attempts: 3
  campaign:
    poll-interval-ms: 3600000
  cors:
    allowed-origins: http://localhost:4200
